name: Deploy to Raspberry Pi

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.PI_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Pi
        run: |
          ssh ${{ secrets.PI_USER }}@${{ secrets.PI_HOST }} '
            cd ~/HouseRiant &&
            git pull &&
            cd frontend &&
            npm install &&
            npm run build &&
            cd ~/HouseRiant/backend/HouseRiant/HouseRiant &&
            dotnet publish -c Release -o ~/houseriant-backend &&
            sudo systemctl restart houseriant-backend &&
            sudo systemctl restart nginx
          '
